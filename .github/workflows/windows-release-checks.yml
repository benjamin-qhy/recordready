name: Windows release checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['desktop/windows/**', 'scripts/release/**', '.github/workflows/windows-release-checks.yml']
  pull_request:
    paths: ['desktop/windows/**', 'scripts/release/**', '.github/workflows/windows-release-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm --dir desktop/windows install --frozen-lockfile --ignore-scripts
      - run: node --test desktop/windows/tests/*.test.mjs
      - run: python3 scripts/release/deploy-remote.test.py
      - run: python3 scripts/release/deploy-windows-remote.test.py
