# Install as a separate virtual host. Obtain a certificate for this domain first.
server {
    listen 80;
    listen [::]:80;
    server_name recordready.qiushui.me;
    location /.well-known/acme-challenge/ { root /srv/recordready/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name recordready.qiushui.me;
    ssl_certificate /etc/letsencrypt/live/recordready.qiushui.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recordready.qiushui.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/recordready.access.log;
    error_log /var/log/nginx/recordready.error.log;
    charset utf-8;
    autoindex off;
    root /srv/recordready/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /releases/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /updates/ {
        default_type application/xml;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
